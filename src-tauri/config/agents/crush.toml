# AgentHub · Agent 定义 —— Crush

[agent]
id = "crush"
name = "Crush"
vendor = "Charm"
kind = "cli"
accent = "#f0abfc"
note = ""
adapter = ""

[[evidence]]
capability = "which"
strength = "strong"
label = "命令行程序 crush"
args = ["crush"]
paths = ["%APPDATA%/npm", "%LOCALAPPDATA%/Microsoft/WinGet/Links", "%USERPROFILE%/.local/bin", "%USERPROFILE%/go/bin"]

[[evidence]]
