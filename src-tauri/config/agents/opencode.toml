# AgentHub · Agent 定义 —— opencode
#
# 本文件是数据，不是代码。AgentHub 内核不含任何 Agent 专属逻辑：
# 内核只提供带分级的基础能力（见「Agent 定义与能力」页 / capability.rs 能力目录），
# 本文件负责声明「去哪找、怎么判定、每条路径扮演什么角色、允许写到哪一级」。
#
# 判定证据的默认派生规则（无需重复声明）：
#   paths[].role = "install" → 强证据（程序安装目录）
#   paths[].role = "config"  → 中证据（配置文件）
#   paths[].role = "data"    → 弱证据（数据目录）
#   paths[].role = "skills"  → 弱证据（技能目录）
# 无法用路径表达的判定（which / npm.global.has / link.read …）才需要显式 [[evidence]]。

[agent]
id = "opencode"
name = "opencode"
vendor = "SST"
kind = "cli"                 # cli | ide | extension | host
accent = "#8b8bff"
note = "使用 XDG 目录（~/.config/opencode）而非 ~/.opencode 作为主配置位置"
adapter = ""                 # 内置同步适配器标识（M2 起可用）

# ── 显式证据：程序本体与全局包 ──────────────────────────────────────
[[evidence]]
capability = "which"
strength = "strong"
label = "命令行程序 opencode"
args = ["opencode"]
paths = ["%APPDATA%/npm", "%PROGRAMDATA%/npm/npm", "%USERPROFILE%/.opencode/bin", "%LOCALAPPDATA%/Microsoft/WinGet/Links"]

[[evidence]]
capability = "npm.global.has"
strength = "strong"
label = "全局 npm 包"
args = ["opencode-ai", "@opencode-ai/cli-node-windows-x64"]

# ── 路径与角色 ──────────────────────────────────────────────────────
[[paths]]
label = "主配置"
path = "~/.config/opencode/opencode.json"
role = "config"
format = "json"

[[paths]]
label = "项目指令"
path = "~/.config/opencode/AGENTS.md"
role = "config"
format = "md"

[[paths]]
label = "插件与依赖"
path = "~/.config/opencode/package.json"
role = "config"
format = "json"

[[paths]]
label = "Skills 目录"
path = "~/.config/opencode/skills"
role = "skills"
deploy = "link"

[[paths]]
label = "程序安装目录"
path = "~/.opencode"
role = "install"

[[paths]]
label = "数据目录"
path = "~/.local/share/opencode"
role = "install"

[[paths]]
label = "运行状态"
path = "~/.local/state/opencode"
role = "data"

[[paths]]
label = "缓存"
path = "~/.cache/opencode"
role = "data"

# ── MCP 配置来源（内核按声明提取，不做格式猜测） ──────────────────────
[[mcp]]
file = "~/.config/opencode/opencode.json"
root = "mcp"
format = "json"
entryStyle = "opencode"      # type=local/remote，command 为数组，环境变量键名为 environment

# ── 供应商线索来源 ──────────────────────────────────────────────────
[[provider]]
file = "~/.config/opencode/opencode.json"
root = "provider"
format = "json"
kind = "base-url"
baseUrlKey = "options.baseURL"
modelsKey = "models"
label = "opencode"

# ── 能力分级授权：该 Agent 允许 AgentHub 操作到哪一级 ──────────────────
[capabilities]
maxTier = "deploy"                      # observe | parse | deploy | mutate
skillMethods = ["link", "copy"]         # 允许的 Skill 部署方式（M2 生效）
configWrite = ["merge-keys"]            # 允许的配置写入方式（M2 生效）
notes = "配置写入在界面走 diff → 确认 → 备份 → 原子写入流程"

# ── Provider 写入声明 ─────────────────────────────────────────────────
# 形状按本机 opencode 实际可用的自定义供应商条目校准：
#   provider.<id> = { npm, name, options.{baseURL, apiKey, modelsDiscovery.enabled} }
# `npm` 与 `modelsDiscovery.enabled` 是固定值（value 字面量），
# 与 opencode 文档的「AI SDK + modelsDiscovery 自动发现模型」形态一致。
# 键名取供应商资源名 —— 与手写条目同名时默认跳过（受管保护，见向导）。
[[providerWrite]]
file = "~/.config/opencode/opencode.json"
root = "provider"
format = "json"
objectPerProvider = true
entries = [
  { key = "npm", value = "@ai-sdk/openai-compatible" },
  { key = "name", from = "name" },
  { key = "options.baseURL", from = "baseUrl" },
  { key = "options.apiKey", from = "apiKey" },
  { key = "options.modelsDiscovery.enabled", value = "true" },
]