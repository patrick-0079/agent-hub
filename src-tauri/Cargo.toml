[package]
name = "agenthub"
version = "0.1.0"
description = "AgentHub - unified environment manager for AI agents"
authors = ["AgentHub"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "agenthub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
toml = "1.0.7"
chrono = "0.4.45"
anyhow = "1.0.104"

[profile.dev]
incremental = true
